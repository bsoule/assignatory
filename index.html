<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FCC99F" />
    <title>Thanksgiving Dinner Assigner (2026 edition)</title>

    <!-- What a link to the app shows when pasted into a chat or a post (iMessage,
         Slack, WhatsApp, Facebook, ...): these crawlers read only this HTML.
         og:title is the <title>; image URLs must be absolute, at the app's Fly
         address. quals/link-preview.qual.mjs checks these agree. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tgdinner.fly.dev/" />
    <meta property="og:title" content="Thanksgiving Dinner Assigner (2026 edition)" />
    <!-- one-sentence description shown under the title in link previews (and
         by search engines): a shared list of who's bringing which dish to
         Thanksgiving dinner. Keep the two copies the same. -->
    <meta name="description" content="Who's bringing what to Thanksgiving dinner." />
    <meta property="og:description" content="Who's bringing what to Thanksgiving dinner." />
    <meta property="og:image" content="https://tgdinner.fly.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- text describing the preview image for people who can't see it: the
         app's turkey badge on a peach background. -->
    <meta property="og:image:alt" content="A stylized turkey." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
